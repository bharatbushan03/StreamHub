services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/streamhub
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENABLE_WORKER_IN_SERVER: "false"
    depends_on:
      - mongo
      - redis
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads

  worker:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/streamhub
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: node src/workers/videoProcessing.worker.js
    depends_on:
      - mongo
      - redis
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  mongo-data:
